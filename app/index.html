    var array = [1, 2, 2, 3,2,2]
    var unique = []

    for (var i = 0; i < array.length; i++) {
        var duplicate = false

        for (var j = i + 1; j < array.length; j++) {
            if (array[i] === array[j]) {
                duplicate = true
                break
            }
        }
        if (duplicate === false) {
            unique.push(array[i])
        }
    }
    console.log(unique)
