<script>
    const successPromise = new Promise((resolve, reject) => {
        resolve('Успешные данные')
    })

    successPromise
        .then(data => {
            console.log('Успех:', data)
        })
        .catch(error => {
            console.log('Сюда код не пойдет:', error)
        })

</script>
