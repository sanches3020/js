<script type="module">

   var array = []
    for(var i = 0; i < 37; i++){
        array.push(0)
    }
    for(var i = 0; i < 20000; i++){
        var random = Math.floor(Math.random()*36)

        array[random] = array[random] + 1

    }
    var sum4t =0
    for(var i = 0; i < 37; i++){
        if(i%2 === 0 && i !== 0){
            sum4t += array[i]
        }
    }

    var sumne4t =0
    for(var i = 0; i < 37; i++){
        if(i%2 === 1 ){
            sumne4t+= array[i]
        }
    }
console.log("Первый элемент" + array[0]/20000)
console.log("черные" + sum4t/20000)
console.log("красные" + sumne4t/20000)


</script>
